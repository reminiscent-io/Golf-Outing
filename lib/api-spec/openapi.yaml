openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Golf Trip Live Scorecard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Phone+OTP authentication
  - name: users
    description: User accounts, profiles, search, and follow graph
  - name: trips
    description: Golf trip operations
  - name: players
    description: Player operations
  - name: rounds
    description: Round operations
  - name: scores
    description: Score entry operations
  - name: leaderboard
    description: Leaderboard & stats
  - name: groups
    description: Per-round foursome assignments

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /trips:
    get:
      operationId: listTrips
      tags: [trips]
      summary: List all golf trips
      responses:
        "200":
          description: List of trips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trip"
    post:
      operationId: createTrip
      tags: [trips]
      summary: Create a new golf trip
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTripBody"
      responses:
        "201":
          description: Created trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "401":
          description: Unauthorized

  /trips/{tripId}:
    get:
      operationId: getTrip
      tags: [trips]
      summary: Get a trip by ID
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "404":
          description: Not found
    patch:
      operationId: updateTrip
      tags: [trips]
      summary: Update a trip
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTripBody"
      responses:
        "200":
          description: Updated trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "403":
          description: Not the trip creator
        "404":
          description: Not found
    delete:
      operationId: deleteTrip
      tags: [trips]
      summary: Delete a trip
      description: >-
        Permanently deletes the trip and all data attached to it (rounds,
        players, scores, comments, kudos). Only the trip's creator may do this.
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Not the trip creator
        "404":
          description: Not found

  /auth/request-otp:
    post:
      operationId: requestOtp
      tags: [auth]
      summary: Request a 6-digit OTP sent via SMS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestOtpBody"
      responses:
        "200":
          description: OTP issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestOtpResponse"
        "429":
          description: Rate limited

  /auth/verify-otp:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Verify a 6-digit OTP and return a 30d JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpBody"
      responses:
        "200":
          description: Verified; token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Bad code or missing full name for new user
        "401":
          description: OTP not valid

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the current user from a bearer JWT
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
    patch:
      operationId: updateMe
      tags: [auth]
      summary: Update the current user's profile (handicap)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Issue a new 30d JWT for the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Unauthorized

  /auth/me/handicap-history:
    get:
      operationId: getMyHandicapHistory
      tags: [auth]
      summary: Full handicap-change history for the current user, newest first
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Handicap history rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HandicapHistoryEntry"
        "401":
          description: Unauthorized

  /users/me/trips:
    get:
      operationId: listMyTrips
      tags: [users]
      summary: List trips associated with the current user (via player link or saved)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of user-trip associations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserTripAssociation"
        "401":
          description: Unauthorized

  /users/me/stats:
    get:
      operationId: getMyStats
      tags: [users]
      summary: Aggregate golf history for the current user (rounds, hole outcomes, scoring, co-players)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyStatsResponse"
        "401":
          description: Unauthorized

  /users/me/rounds:
    get:
      operationId: listMyRounds
      tags: [users]
      summary: All rounds where the caller has a player row, joined to optional trip
      security:
        - bearerAuth: []
      parameters:
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [all, solo, trip]
            default: all
      responses:
        "200":
          description: Rounds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyRoundsItem"
        "401":
          description: Unauthorized

  /users/me/trips/{tripId}:
    post:
      operationId: saveTrip
      tags: [users]
      summary: Save (follow) a trip to the current user's account
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Saved
        "401":
          description: Unauthorized
        "404":
          description: Trip not found
    delete:
      operationId: unsaveTrip
      tags: [users]
      summary: Unsave a trip from the current user's account
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "401":
          description: Unauthorized

  /users/{userId}:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Public user profile + recent rounds + viewer relationship
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Profile payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
        "404":
          description: User not found

  /users/search:
    get:
      operationId: searchUsers
      tags: [users]
      summary: Fuzzy name search; honors privacy and phone-discoverability gates
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Matched users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSearchHit"
        "401":
          description: Unauthorized

  /users/me/buddies:
    get:
      operationId: listMyBuddies
      tags: [users]
      summary: Other users who have shared a round with me, ordered by rounds-together
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Buddy list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Buddy"
        "401":
          description: Unauthorized

  /users/me/connections:
    get:
      operationId: listMyConnections
      tags: [users]
      summary: People I've played with, split into accounts and pending placeholders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Connections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionsResponse" }
        "401":
          description: Unauthorized

  /users/me/claimable:
    get:
      operationId: listMyClaimable
      tags: [users]
      summary: Player rows tagged to my verified phone that I can claim
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Claimable items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClaimableItem" }
        "401":
          description: Unauthorized

  /users/me/claims:
    post:
      operationId: submitClaims
      tags: [users]
      summary: Accept or decline tagged player rows (phone-matched or via a share code)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClaimRequestBody" }
      responses:
        "200":
          description: Claim result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClaimResult" }
        "401":
          description: Unauthorized

  /claim/{code}:
    get:
      operationId: getClaimPreview
      tags: [players]
      summary: Public preview of what a share code claims
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClaimPreview" }
        "404":
          description: Unknown or already-redeemed code

  /trips/{tripId}/players/{playerId}/invite:
    post:
      operationId: createPlayerInvite
      tags: [players]
      summary: Generate (or rotate) a single-use share code for an unclaimed player row
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: integer }
        - name: playerId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Invite code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteResponse" }
        "401":
          description: Unauthorized
        "403":
          description: Not a participant in this trip
        "409":
          description: Row already claimed

  /users/{userId}/follow:
    post:
      operationId: followUser
      tags: [users]
      summary: Follow a user
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Followed (idempotent)
        "400":
          description: Cannot follow self
        "401":
          description: Unauthorized
        "403":
          description: Target profile is private
        "404":
          description: Not found
    delete:
      operationId: unfollowUser
      tags: [users]
      summary: Unfollow a user
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Unfollowed (idempotent)
        "401":
          description: Unauthorized

  /users/{userId}/followers:
    get:
      operationId: listFollowers
      tags: [users]
      summary: Paginated followers of a user
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: before
          in: query
          required: false
          schema:
            type: string
            description: ISO timestamp; return rows older than this.
      responses:
        "200":
          description: Followers page
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FollowEntry"

  /users/{userId}/following:
    get:
      operationId: listFollowing
      tags: [users]
      summary: Paginated users that this user is following
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: before
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Following page
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FollowEntry"

  /rounds/{roundId}/kudos:
    post:
      operationId: giveKudos
      tags: [rounds]
      summary: Give kudos to a round (idempotent)
      security:
        - bearerAuth: []
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Kudosed
        "401":
          description: Unauthorized
        "403":
          description: Round is private
        "404":
          description: Round not found
    delete:
      operationId: revokeKudos
      tags: [rounds]
      summary: Remove your kudos from a round
      security:
        - bearerAuth: []
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /rounds/{roundId}/comments:
    get:
      operationId: listRoundComments
      tags: [rounds]
      summary: List comments on a round (sorted oldest first)
      security:
        - bearerAuth: []
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoundComment"
    post:
      operationId: createRoundComment
      tags: [rounds]
      summary: Post a comment (optionally as a one-level reply)
      security:
        - bearerAuth: []
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoundCommentBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundComment"
        "400":
          description: Invalid parentCommentId (cross-round or nested reply)
        "401":
          description: Unauthorized
        "403":
          description: Round is private

  /comments/{commentId}:
    delete:
      operationId: deleteRoundComment
      tags: [rounds]
      summary: Delete your own comment
      security:
        - bearerAuth: []
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "403":
          description: Not the author
        "404":
          description: Not found

  /rounds/{roundId}/social:
    get:
      operationId: getRoundSocial
      tags: [rounds]
      summary: Aggregate kudos + comments + viewer relation for one round
      security:
        - bearerAuth: []
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Aggregate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundSocial"

  /feed:
    get:
      operationId: getFeed
      tags: [rounds]
      summary: Paginated feed of public rounds, filtered by tab
      security:
        - bearerAuth: []
      parameters:
        - name: tab
          in: query
          required: true
          schema:
            type: string
            enum: [buddies, mine, all]
        - name: before
          in: query
          required: false
          schema:
            type: string
            description: ISO timestamp; return items with sort-key older than this.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Feed page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPage"

  /trips/{tripId}/players:
    get:
      operationId: listPlayers
      tags: [players]
      summary: List players in a trip
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
    post:
      operationId: createPlayer
      tags: [players]
      summary: Add a player to a trip
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlayerBody"
      responses:
        "201":
          description: Created player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /trips/{tripId}/players/{playerId}:
    patch:
      operationId: updatePlayer
      tags: [players]
      summary: Update a player
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlayerBody"
      responses:
        "200":
          description: Updated player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
    delete:
      operationId: deletePlayer
      tags: [players]
      summary: Remove a player
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /rounds:
    post:
      operationId: createRoundV2
      tags: [rounds]
      summary: Create a round, optionally attached to a trip
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoundV2Body"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRoundV2Response"
        "401":
          description: Unauthorized
        "403":
          description: Caller is not a player or follower of the requested trip

  /rounds/{roundId}:
    get:
      operationId: getSoloRound
      tags: [rounds]
      summary: Get a round by id (works for both solo and trip rounds)
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Round
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Round"
        "404":
          description: Not found or not visible
    patch:
      operationId: updateSoloRound
      tags: [rounds]
      summary: Update a solo round (trip-attached rounds use the trip-scoped endpoint)
      security:
        - bearerAuth: []
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoundBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Round"
        "403":
          description: Caller does not own this round
        "404":
          description: Round not found
    delete:
      operationId: deleteSoloRound
      tags: [rounds]
      summary: Delete a solo round
      security:
        - bearerAuth: []
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Caller does not own this round
        "404":
          description: Round not found

  /rounds/{roundId}/scores:
    get:
      operationId: getSoloRoundScores
      tags: [scores]
      summary: Get all score rows for a (solo) round, keyed by roundId only
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerScore"
    put:
      operationId: upsertSoloRoundScore
      tags: [scores]
      summary: Upsert one player's score for one hole (solo round path)
      security:
        - bearerAuth: []
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertScoreBody"
      responses:
        "200":
          description: Upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerScore"

  /trips/{tripId}/rounds:
    get:
      operationId: listRounds
      tags: [rounds]
      summary: List rounds in a trip
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of rounds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Round"
    post:
      operationId: createRound
      tags: [rounds]
      summary: Create a round in a trip
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoundBody"
      responses:
        "201":
          description: Created round
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Round"
        "401":
          description: Unauthorized
        "403":
          description: Caller is not a player or follower of this trip

  /trips/{tripId}/rounds/{roundId}:
    get:
      operationId: getRound
      tags: [rounds]
      summary: Get a round
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: roundId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Round
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Round"
        "404":
          description: Not found
    patch:
      operationId: updateRound
      tags: [rounds]
      summary: Update a round (course info, par, hcp index, games config)
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: roundId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoundBody"
      responses:
        "200":
          description: Updated round
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Round"
    delete:
      operationId: deleteRound
      tags: [rounds]
      summary: Delete a round
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: roundId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /trips/{tripId}/rounds/{roundId}/scores:
    get:
      operationId: getScores
      tags: [scores]
      summary: Get all scores for a round
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: roundId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: All scores for the round (array of per-player score entries)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerScore"
    put:
      operationId: upsertScore
      tags: [scores]
      summary: Set/update a single hole score for a player
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: roundId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertScoreBody"
      responses:
        "200":
          description: Updated score entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerScore"

  /trips/{tripId}/rounds/{roundId}/scramble-scores:
    get:
      operationId: getScrambleScores
      tags: [scores]
      summary: Get all scramble team scores for a round
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: roundId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: All scramble team score rows for the round
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrambleScores"
    put:
      operationId: upsertScrambleScore
      tags: [scores]
      summary: Set/update a single hole score for a scramble team
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: roundId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertScrambleScoreBody"
      responses:
        "200":
          description: Updated scramble team score row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrambleTeamScore"

  /trips/{tripId}/rounds/{roundId}/leaderboard:
    get:
      operationId: getRoundLeaderboard
      tags: [leaderboard]
      summary: Get computed leaderboard for a round (net stroke, stableford, skins, nassau)
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: roundId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Leaderboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundLeaderboard"

  /trips/{tripId}/rounds/{roundId}/groups:
    get:
      operationId: listRoundGroups
      tags: [groups]
      summary: List foursome assignments for a round
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: roundId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Group assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundGroupAssignments"
    put:
      operationId: putRoundGroups
      tags: [groups]
      summary: Replace all foursome assignments for a round
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: roundId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoundGroupAssignments"
      responses:
        "200":
          description: Saved assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundGroupAssignments"
        "400":
          description: One or more players do not belong to this trip
        "404":
          description: Round not found or not part of the trip

  /trips/{tripId}/rounds/{roundId}/groups/{groupNumber}/completion:
    put:
      operationId: putRoundGroupCompletion
      tags: [groups]
      summary: Mark a single foursome's round complete (or reopen it)
      description: >-
        Marks one group's round complete without affecting other groups sharing
        the same scorecard. The round-level `completedAt` is only set once every
        assigned group is complete, and is cleared again if any group reopens.
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: roundId
          in: path
          required: true
          schema:
            type: integer
        - name: groupNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutRoundGroupCompletionBody"
      responses:
        "200":
          description: Updated assignments and completions for the round
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundGroupAssignments"
        "401":
          description: Not authenticated
        "403":
          description: Only players in this round can mark a group complete
        "404":
          description: Round not found or the group has no players assigned

  /trips/{tripId}/leaderboard:
    get:
      operationId: getTripLeaderboard
      tags: [leaderboard]
      summary: Get trip-wide leaderboard (aggregated across all rounds)
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trip leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripLeaderboard"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Trip:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        createdByUserId:
          type: ["integer", "null"]
          description: User who created the trip; null for legacy trips created before attribution.
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - createdAt
        - updatedAt

    CreateTripBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
      required:
        - name

    UpdateTripBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]

    User:
      type: object
      properties:
        id:
          type: integer
        phone:
          type: string
          description: E.164-formatted phone number
        fullName:
          type: string
        handicap:
          type: ["number", "null"]
          description: User's current handicap index; autofilled when joining new trips.
        ghinNumber:
          type: ["string", "null"]
          description: User's GHIN registry number (digits only).
        handicapSource:
          type: string
          enum: [manual, ghin]
          description: What populated handicap last. Currently always 'manual'.
        handicapSyncedAt:
          type: ["string", "null"]
          format: date-time
          description: When handicap was last fetched from GHIN. Currently always null.
        discoverableByPhone:
          type: boolean
        profileVisibility:
          type: string
          enum: [public, private]
        createdAt:
          type: string
      required:
        - id
        - phone
        - fullName
        - handicapSource
        - discoverableByPhone
        - profileVisibility
        - createdAt

    UpdateMeBody:
      type: object
      properties:
        handicap:
          type: ["number", "null"]
          minimum: 0
          maximum: 54
        ghinNumber:
          type: ["string", "null"]
          pattern: "^[0-9]+$"
          minLength: 5
          maxLength: 12
          description: Digits only. Send null to clear.
        discoverableByPhone:
          type: boolean
        profileVisibility:
          type: string
          enum: [public, private]
        fullName:
          type: string
          minLength: 1
          maxLength: 80

    HandicapHistoryEntry:
      type: object
      properties:
        handicap:
          type: number
        source:
          type: string
          enum: [manual, ghin, initial]
        recordedAt:
          type: string
          format: date-time
      required:
        - handicap
        - source
        - recordedAt

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        fullName:
          type: string
        handicap:
          type: ["number", "null"]
        profileVisibility:
          type: string
          enum: [public, private]
        createdAt:
          type: string
        stats:
          $ref: "#/components/schemas/UserProfileStats"
        recentRounds:
          type: array
          items:
            $ref: "#/components/schemas/FeedItem"
        followerCount:
          type: integer
        followingCount:
          type: integer
        viewerRelation:
          type: object
          properties:
            isSelf:
              type: boolean
            isFollowing:
              type: boolean
            isFollowedBy:
              type: boolean
          required: [isSelf, isFollowing, isFollowedBy]
      required:
        - id
        - fullName
        - profileVisibility
        - createdAt
        - followerCount
        - followingCount
        - viewerRelation

    UserProfileStats:
      type: object
      properties:
        roundsPlayed:
          type: integer
        bestNet:
          type: ["integer", "null"]
        avgNetLast10:
          type: ["number", "null"]
        coursesPlayed:
          type: integer
      required:
        - roundsPlayed
        - coursesPlayed

    UserSearchHit:
      type: object
      properties:
        id:
          type: integer
        fullName:
          type: string
        handicap:
          type: ["number", "null"]
      required: [id, fullName]

    Buddy:
      type: object
      properties:
        userId:
          type: integer
        fullName:
          type: string
        handicap:
          type: ["number", "null"]
        roundsTogether:
          type: integer
        lastPlayedAt:
          type: ["string", "null"]
      required: [userId, fullName, roundsTogether]

    ConnectionAccount:
      type: object
      properties:
        userId: { type: integer }
        name: { type: string }
        sharedRounds: { type: integer }
      required: [userId, name, sharedRounds]

    ConnectionPending:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        tripId: { type: ["integer", "null"] }
        hasPhone: { type: boolean }
        hasInvite: { type: boolean }
        playerIds:
          type: array
          items: { type: integer }
        sharedRounds: { type: integer }
      required: [id, name, hasPhone, hasInvite, playerIds, sharedRounds]

    ConnectionsResponse:
      type: object
      properties:
        accounts:
          type: array
          items: { $ref: "#/components/schemas/ConnectionAccount" }
        pending:
          type: array
          items: { $ref: "#/components/schemas/ConnectionPending" }
      required: [accounts, pending]

    ClaimableRound:
      type: object
      properties:
        roundId: { type: integer }
        name: { type: string }
        date: { type: ["string", "null"] }
      required: [roundId, name]

    ClaimableItem:
      type: object
      properties:
        playerId: { type: integer }
        name: { type: string }
        tripId: { type: ["integer", "null"] }
        tripName: { type: ["string", "null"] }
        taggedBy: { type: ["string", "null"] }
        rounds:
          type: array
          items: { $ref: "#/components/schemas/ClaimableRound" }
      required: [playerId, name, rounds]

    ClaimPreview:
      type: object
      properties:
        playerId: { type: integer }
        name: { type: string }
        tripName: { type: ["string", "null"] }
        taggedBy: { type: ["string", "null"] }
        rounds:
          type: array
          items: { $ref: "#/components/schemas/ClaimableRound" }
      required: [playerId, name, rounds]

    ClaimRequestBody:
      type: object
      properties:
        accepts:
          type: array
          items: { type: integer }
        declines:
          type: array
          items: { type: integer }
        code: { type: ["string", "null"] }
      required: [accepts]

    ClaimSkip:
      type: object
      properties:
        playerId: { type: integer }
        reason: { type: string }
      required: [playerId, reason]

    ClaimResult:
      type: object
      properties:
        claimed:
          type: array
          items: { type: integer }
        skipped:
          type: array
          items: { $ref: "#/components/schemas/ClaimSkip" }
      required: [claimed, skipped]

    InviteResponse:
      type: object
      properties:
        code: { type: string }
        path: { type: string }
      required: [code, path]

    FollowEntry:
      type: object
      properties:
        userId:
          type: integer
        fullName:
          type: string
        handicap:
          type: ["number", "null"]
        followedAt:
          type: string
      required: [userId, fullName, followedAt]

    RoundComment:
      type: object
      properties:
        id:
          type: integer
        roundId:
          type: integer
        userId:
          type: integer
        userFullName:
          type: string
        parentCommentId:
          type: ["integer", "null"]
        body:
          type: string
        createdAt:
          type: string
      required: [id, roundId, userId, userFullName, body, createdAt]

    CreateRoundCommentBody:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 1000
        parentCommentId:
          type: ["integer", "null"]
      required: [body]

    RoundSocial:
      type: object
      properties:
        kudos:
          type: object
          properties:
            count:
              type: integer
            viewerHasKudosed:
              type: boolean
            recentUsers:
              type: array
              items:
                $ref: "#/components/schemas/UserSearchHit"
          required: [count, viewerHasKudosed, recentUsers]
        comments:
          type: object
          properties:
            count:
              type: integer
            items:
              type: array
              items:
                $ref: "#/components/schemas/RoundComment"
          required: [count, items]
      required: [kudos, comments]

    FeedPlayer:
      type: object
      properties:
        playerId:
          type: integer
        playerName:
          type: string
        userId:
          type: ["integer", "null"]
        gross:
          type: ["integer", "null"]
          description: Running gross for live rounds, final gross when complete; null until a score is entered.
      required: [playerId, playerName]

    FeedItem:
      type: object
      properties:
        roundId:
          type: integer
        tripId:
          type: ["integer", "null"]
        name:
          type: string
        course:
          type: ["string", "null"]
        date:
          type: ["string", "null"]
        completedAt:
          type: ["string", "null"]
        updatedAt:
          type: string
        visibility:
          type: string
          enum: [public, private]
        players:
          type: array
          items:
            $ref: "#/components/schemas/FeedPlayer"
        summary:
          $ref: "#/components/schemas/FeedItemSummary"
        kudosCount:
          type: integer
        commentCount:
          type: integer
        viewerHasKudosed:
          type: boolean
      required:
        - roundId
        - tripId
        - name
        - updatedAt
        - visibility
        - players
        - summary
        - kudosCount
        - commentCount
        - viewerHasKudosed

    FeedItemSummary:
      type: object
      properties:
        leaderName:
          type: ["string", "null"]
        leaderNet:
          type: ["integer", "null"]
        leaderGross:
          type: ["integer", "null"]
        holesPlayed:
          type: integer
        totalHoles:
          type: integer
      required: [holesPlayed, totalHoles]

    FeedPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeedItem"
        nextBefore:
          type: ["string", "null"]
      required: [items, nextBefore]

    RequestOtpBody:
      type: object
      properties:
        phone:
          type: string
          description: E.164-formatted phone number
        fullName:
          type: string
          description: Optional. Only honored if a brand-new user is created at verify time.
      required:
        - phone

    RequestOtpResponse:
      type: object
      properties:
        ok:
          type: boolean
        expiresAt:
          type: string
        isNewUser:
          type: boolean
      required:
        - ok
        - expiresAt
        - isNewUser

    VerifyOtpBody:
      type: object
      properties:
        phone:
          type: string
        code:
          type: string
          minLength: 6
          maxLength: 6
        fullName:
          type: string
          description: Required when verifying for a phone number that has no user yet.
        ghinNumber:
          type: ["string", "null"]
          pattern: "^[0-9]+$"
          minLength: 5
          maxLength: 12
          description: Optional. Only honored when this phone is a new user.
      required:
        - phone
        - code

    AuthSession:
      type: object
      properties:
        token:
          type: string
        expiresAt:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - expiresAt
        - user

    UserTripAssociation:
      type: object
      properties:
        trip:
          $ref: "#/components/schemas/Trip"
        via:
          type: string
          enum: [player, saved, both]
        players:
          type: array
          items:
            $ref: "#/components/schemas/Player"
        dateRange:
          description: First and last round date (YYYY-MM-DD) recorded against the trip; null when no round has a date set.
          oneOf:
            - type: "null"
            - type: object
              properties:
                start:
                  type: string
                end:
                  type: string
              required:
                - start
                - end
      required:
        - trip
        - via
        - players
        - dateRange

    MyStatsResponse:
      type: object
      description: Aggregate of every round the user has played plus every trip they've created.
      properties:
        tripsCreated:
          type: integer
          description: Trips where the user is the original creator.
        roundsPlayed:
          type: integer
          description: Distinct rounds where the user (via any linked player) entered at least one hole score.
        holesPlayed:
          type: integer
          description: Total non-null hole scores recorded across all rounds.
        scoring:
          type: object
          description: Gross stroke totals across COMPLETED 18-hole rounds only.
          properties:
            bestGross:
              type: ["integer", "null"]
            worstGross:
              type: ["integer", "null"]
            avgGross:
              type: ["number", "null"]
            completedRounds:
              type: integer
              description: Number of 18-hole rounds with every hole scored.
          required:
            - bestGross
            - worstGross
            - avgGross
            - completedRounds
        holeOutcomes:
          type: object
          description: Counts of holes where (score - par) fell in each bucket. Eagles roll up albatross or better; quadPlus rolls up +4 or worse.
          properties:
            eagles:
              type: integer
            birdies:
              type: integer
            pars:
              type: integer
            bogeys:
              type: integer
            doubles:
              type: integer
            triples:
              type: integer
            quadPlus:
              type: integer
          required:
            - eagles
            - birdies
            - pars
            - bogeys
            - doubles
            - triples
            - quadPlus
        playersPlayedWith:
          type: array
          description: Distinct co-players (excluding the user) ranked by number of shared rounds. The same person across trips appears once when their player rows share a userId, otherwise once per name.
          items:
            type: object
            properties:
              name:
                type: string
              rounds:
                type: integer
            required:
              - name
              - rounds
        roundHistory:
          type: array
          description: Completed 18-hole rounds in chronological order (oldest first). Each entry includes the gross total and the handicap used at the time, so a chart can show score progression alongside handicap.
          items:
            type: object
            properties:
              roundId:
                type: integer
              tripId:
                type: integer
              name:
                type: string
              course:
                type: ["string", "null"]
              date:
                type: ["string", "null"]
                description: Round date as entered (ISO-ish YYYY-MM-DD or null).
              playedAt:
                type: string
                format: date-time
                description: Effective date used for ordering — completedAt when set, else updatedAt.
              gross:
                type: integer
              par:
                type: integer
                description: Sum of par across all 18 holes for the round.
              handicap:
                type: number
                description: Handicap of the user's player row for this round.
            required:
              - roundId
              - tripId
              - name
              - course
              - date
              - playedAt
              - gross
              - par
              - handicap
      required:
        - tripsCreated
        - roundsPlayed
        - holesPlayed
        - scoring
        - holeOutcomes
        - playersPlayedWith
        - roundHistory

    Player:
      type: object
      properties:
        id:
          type: integer
        tripId:
          type: integer
        userId:
          type: ["integer", "null"]
        name:
          type: string
        handicap:
          type: number
        createdAt:
          type: string
      required:
        - id
        - tripId
        - name
        - handicap
        - createdAt

    CreatePlayerBody:
      type: object
      properties:
        name:
          type: string
        handicap:
          type: number
        userId:
          type: ["integer", "null"]
        invitedPhone:
          type: ["string", "null"]
          description: Optional phone (any format) reserving this row for a specific person; normalized server-side. Write-only — never returned.
      required:
        - name
        - handicap

    UpdatePlayerBody:
      type: object
      properties:
        name:
          type: string
        handicap:
          type: number
        userId:
          type: ["integer", "null"]
        invitedPhone:
          type: ["string", "null"]
          description: Optional phone (any format) reserving this row for a specific person; normalized server-side. Write-only — never returned.

    Round:
      type: object
      properties:
        id:
          type: integer
        tripId:
          type: ["integer", "null"]
        createdByUserId:
          type: ["integer", "null"]
          description: User who created the round; null for legacy rounds created before attribution.
        name:
          type: string
        course:
          type: ["string", "null"]
        date:
          type: ["string", "null"]
        par:
          type: array
          items:
            type: integer
          description: 18 values - par for each hole
        holeHcp:
          type: array
          items:
            type: integer
          description: 18 values - handicap stroke index for each hole (1-18)
        gamesConfig:
          $ref: "#/components/schemas/GamesConfig"
        handicapMode:
          type: string
          enum: [net, gross]
          description: "net = course-adjusted (low plays scratch); gross = use raw handicap"
        teeBox:
          type: ["string", "null"]
        courseRating:
          type: ["number", "null"]
        courseSlope:
          type: ["integer", "null"]
        visibility:
          type: string
          enum: [public, private]
        completedAt:
          type: ["string", "null"]
          description: ISO timestamp set when the round is explicitly marked complete or all 18 holes scored.
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - tripId
        - name
        - par
        - holeHcp
        - gamesConfig
        - handicapMode
        - visibility
        - createdAt
        - updatedAt

    GamesConfig:
      type: object
      properties:
        stableford:
          type: boolean
        skins:
          type: boolean
        nassau:
          type: boolean
        netStroke:
          type: boolean
        bestBall:
          type: boolean
        bestBallTeams:
          type: array
          items:
            $ref: "#/components/schemas/Team"
        matchPlay:
          type: boolean
        matchPlayMatches:
          type: array
          items:
            $ref: "#/components/schemas/Match"
        scramble:
          type: boolean
          description: When true, scramble replaces individual game modes for this round.
        scrambleType:
          type: ["string", "null"]
          enum: ["fourMan", "twoMan", null]
          description: "fourMan = whole group is one team. twoMan = slots 1-2 and 3-4 form two cart teams."
      required:
        - stableford
        - skins
        - nassau
        - netStroke
        - bestBall
        - matchPlay

    Team:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        playerIds:
          type: array
          items:
            type: integer
      required:
        - id
        - name
        - playerIds

    Match:
      type: object
      properties:
        id:
          type: string
        playerA:
          type: integer
        playerB:
          type: integer
      required:
        - id
        - playerA
        - playerB

    MyRoundsItem:
      type: object
      properties:
        round:
          $ref: "#/components/schemas/Round"
        trip:
          oneOf:
            - $ref: "#/components/schemas/Trip"
            - type: "null"
        gross:
          type: ["integer", "null"]
          description: Caller's gross total if the round is complete, else null.
        net:
          type: ["number", "null"]
          description: Caller's net total relative to par if the round is complete, else null.
        holesPlayed:
          type: integer
          description: Number of holes the caller has a score for.
      required: [round, holesPlayed]

    CreateRoundV2Body:
      type: object
      properties:
        tripId:
          type: ["integer", "null"]
          description: Optional trip to attach this round to. Caller must be a player or follower of that trip.
        name:
          type: string
          minLength: 1
          maxLength: 120
        course:
          type: ["string", "null"]
        date:
          type: ["string", "null"]
        par:
          type: array
          items:
            type: integer
        holeHcp:
          type: array
          items:
            type: integer
        teeBox:
          type: ["string", "null"]
        courseRating:
          type: ["number", "null"]
        courseSlope:
          type: ["integer", "null"]
      required: [name]

    CreateRoundV2Response:
      type: object
      properties:
        tripId:
          type: ["integer", "null"]
        roundId:
          type: integer
        playerId:
          type: integer
      required: [roundId, playerId]

    CreateRoundBody:
      type: object
      properties:
        name:
          type: string
        course:
          type: ["string", "null"]
        date:
          type: ["string", "null"]
        par:
          type: array
          items:
            type: integer
        holeHcp:
          type: array
          items:
            type: integer
        gamesConfig:
          $ref: "#/components/schemas/GamesConfig"
        handicapMode:
          type: string
          enum: [net, gross]
        teeBox:
          type: ["string", "null"]
        courseRating:
          type: ["number", "null"]
        courseSlope:
          type: ["integer", "null"]
      required:
        - name

    UpdateRoundBody:
      type: object
      properties:
        name:
          type: string
        course:
          type: ["string", "null"]
        date:
          type: ["string", "null"]
        par:
          type: array
          items:
            type: integer
        holeHcp:
          type: array
          items:
            type: integer
        gamesConfig:
          $ref: "#/components/schemas/GamesConfig"
        handicapMode:
          type: string
          enum: [net, gross]
        teeBox:
          type: ["string", "null"]
        courseRating:
          type: ["number", "null"]
        courseSlope:
          type: ["integer", "null"]
        visibility:
          type: string
          enum: [public, private]
        completedAt:
          type: ["string", "null"]
          description: Send a timestamp to mark the round complete; send null to clear.

    PlayerScore:
      type: object
      properties:
        id:
          type: integer
        roundId:
          type: integer
        playerId:
          type: integer
        holeScores:
          type: array
          items:
            type: ["integer", "null"]
          description: 18 values - gross score per hole (null = not entered)
      required:
        - id
        - roundId
        - playerId
        - holeScores

    UpsertScoreBody:
      type: object
      properties:
        playerId:
          type: integer
        hole:
          type: integer
          description: Hole number 1-18
        score:
          type: ["integer", "null"]
          description: Gross score (null to clear)
      required:
        - playerId
        - hole

    PlayerLeaderboardEntry:
      type: object
      properties:
        playerId:
          type: integer
        playerName:
          type: string
        handicap:
          type: number
        grossTotal:
          type: ["integer", "null"]
        netTotal:
          type: ["integer", "null"]
        stablefordTotal:
          type: ["integer", "null"]
        skinsWon:
          type: integer
        holesPlayed:
          type: integer
      required:
        - playerId
        - playerName
        - handicap
        - skinsWon
        - holesPlayed

    SkinHoleResult:
      type: object
      properties:
        hole:
          type: integer
        winnerId:
          type: ["integer", "null"]
        winnerName:
          type: ["string", "null"]
        carry:
          type: integer
        tied:
          type: boolean
      required:
        - hole
        - carry
        - tied

    NassauResult:
      type: object
      properties:
        matches:
          type: array
          items:
            $ref: "#/components/schemas/TeamNassauMatch"
      required:
        - matches

    TeamNassauMatch:
      type: object
      properties:
        groupNumber:
          type: integer
        teamA:
          type: integer
        teamB:
          type: integer
        teamAPlayerIds:
          type: array
          items:
            type: integer
        teamBPlayerIds:
          type: array
          items:
            type: integer
        front:
          type: ["string", "null"]
          enum: ["A", "B", "halved", null]
        back:
          type: ["string", "null"]
          enum: ["A", "B", "halved", null]
        total:
          type: ["string", "null"]
          enum: ["A", "B", "halved", null]
        frontMargin:
          type: integer
        backMargin:
          type: integer
        totalMargin:
          type: integer
      required:
        - groupNumber
        - teamA
        - teamB
        - teamAPlayerIds
        - teamBPlayerIds
        - front
        - back
        - total
        - frontMargin
        - backMargin
        - totalMargin

    RoundLeaderboard:
      type: object
      properties:
        roundId:
          type: integer
        entries:
          type: array
          items:
            $ref: "#/components/schemas/PlayerLeaderboardEntry"
        skinResults:
          type: array
          items:
            $ref: "#/components/schemas/SkinHoleResult"
        nassauResult:
          $ref: "#/components/schemas/NassauResult"
        scrambleResult:
          $ref: "#/components/schemas/ScrambleResult"
      required:
        - roundId
        - entries
        - skinResults
        - nassauResult
        - scrambleResult

    TripPlayerSummary:
      type: object
      properties:
        playerId:
          type: integer
        playerName:
          type: string
        handicap:
          type: number
        roundsPlayed:
          type: integer
        totalGross:
          type: ["integer", "null"]
        totalNet:
          type: ["integer", "null"]
        totalStableford:
          type: ["integer", "null"]
        totalSkinsWon:
          type: integer
        bestRoundGross:
          type: ["integer", "null"]
      required:
        - playerId
        - playerName
        - handicap
        - roundsPlayed
        - totalSkinsWon

    TripLeaderboard:
      type: object
      properties:
        tripId:
          type: integer
        tripName:
          type: string
        players:
          type: array
          items:
            $ref: "#/components/schemas/TripPlayerSummary"
      required:
        - tripId
        - tripName
        - players

    RoundGroupAssignment:
      type: object
      properties:
        playerId:
          type: integer
        groupNumber:
          type: integer
          minimum: 1
        slotIndex:
          type: integer
          minimum: 1
          maximum: 4
      required:
        - playerId
        - groupNumber
        - slotIndex

    RoundGroupCompletion:
      type: object
      properties:
        groupNumber:
          type: integer
          minimum: 1
        completedAt:
          type: string
          description: ISO timestamp the group marked their round complete.
        completedByUserId:
          type: ["integer", "null"]
          description: User who marked the group complete; null if that user was since removed.
      required:
        - groupNumber
        - completedAt

    RoundGroupAssignments:
      type: object
      properties:
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/RoundGroupAssignment"
        completions:
          type: array
          description: >-
            Per-group completion status. Present on read responses; ignored on
            the PUT-assignments request body. A round rolls up to a final
            `completedAt` only once every assigned group appears here.
          items:
            $ref: "#/components/schemas/RoundGroupCompletion"
      required:
        - assignments

    PutRoundGroupCompletionBody:
      type: object
      properties:
        completed:
          type: boolean
          description: true marks the group's round complete; false reopens it.
      required:
        - completed

    ScrambleTeamScore:
      type: object
      properties:
        groupNumber:
          type: integer
          minimum: 1
        teamSide:
          type: string
          enum: ["A", "B", "G"]
          description: '"G" = whole 4-man group; "A" / "B" = 2-man cart teams (slots 1-2 / 3-4)'
        holeScores:
          type: array
          items:
            type: ["integer", "null"]
          description: 18 values - team gross score per hole (null = not entered)
      required:
        - groupNumber
        - teamSide
        - holeScores

    ScrambleScores:
      type: object
      properties:
        scores:
          type: array
          items:
            $ref: "#/components/schemas/ScrambleTeamScore"
      required:
        - scores

    UpsertScrambleScoreBody:
      type: object
      properties:
        groupNumber:
          type: integer
          minimum: 1
        teamSide:
          type: string
          enum: ["A", "B", "G"]
        hole:
          type: integer
          description: Hole number 1-18
        score:
          type: ["integer", "null"]
          description: Team gross score for the hole (null to clear)
      required:
        - groupNumber
        - teamSide
        - hole

    ScrambleTeamResult:
      type: object
      properties:
        groupNumber:
          type: integer
        teamSide:
          type: string
          enum: ["A", "B", "G"]
        playerIds:
          type: array
          items:
            type: integer
        playerNames:
          type: array
          items:
            type: string
        holeScores:
          type: array
          items:
            type: ["integer", "null"]
        grossOut:
          type: ["integer", "null"]
        grossIn:
          type: ["integer", "null"]
        grossTotal:
          type: ["integer", "null"]
        holesPlayed:
          type: integer
      required:
        - groupNumber
        - teamSide
        - playerIds
        - playerNames
        - holeScores
        - holesPlayed

    ScrambleResult:
      type: object
      properties:
        type:
          type: ["string", "null"]
          enum: ["fourMan", "twoMan", null]
        teams:
          type: array
          items:
            $ref: "#/components/schemas/ScrambleTeamResult"
      required:
        - teams
